[project]
name = "vis-podcaster"
version = "0.1.0"
description = "Two-host podcasts with Vis speech engines, ASR-verified takes and quality gates."
keywords = ["podcast", "speech"]
requires-python = ">=3.12"
dependencies = ["vis-agent>=0.3.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.vis]
category = "workflows"
source_paths = ["src"]
skills = [{ path = "skills/podcast", settings = false }]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
